name: free-gcp-contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject tracked live state without reading credentials
        run: |
          python scripts/check_tracked_runtime_state.py
          python scripts/test_tracked_runtime_state.py
      - name: Preserve regressions and generate the default preset
        run: |
          dotnet test ContosoDGV2.sln --configuration Release
          dotnet run --project DatabaseGenerator --configuration Release --no-build -- forge generate --project examples/free-gcp-lab.project.json --output out/free-gcp
          dotnet run --project DatabaseGenerator --configuration Release --no-build -- forge generate --project examples/free-gcp-lab.project.json --output out/free-gcp-second
          diff -qr out/free-gcp out/free-gcp-second
      - name: Resolve scenarios and architecture plans offline
        run: |
          dotnet run --project DatabaseGenerator --configuration Release --no-build -- forge scenarios list
          dotnet run --project DatabaseGenerator --configuration Release --no-build -- forge presets list
          dotnet run --project DatabaseGenerator --configuration Release --no-build -- forge plan --project examples/free-gcp-lab.project.json --preset free-gcp-connect --output out/plan/connect.json
          dotnet run --project DatabaseGenerator --configuration Release --no-build -- forge plan --project examples/free-gcp-lab.project.json --preset free-gcp-connect --output out/plan/connect-second.json
          diff -u out/plan/connect.json out/plan/connect-second.json
          dotnet run --project DatabaseGenerator --configuration Release --no-build -- forge plan --project examples/free-gcp-lab.project.json --scenario retail.customer_satisfaction_ml --output out/plan/ml.json
          dotnet run --project DatabaseGenerator --configuration Release --no-build -- forge compile --project examples/free-gcp-lab.project.json --output out/planner-compiled
      - name: Validate schemas, notebooks and Python syntax
        run: |
          python -m pip install jsonschema==4.23.0 nbformat==5.10.4 PyYAML==6.0.3
          python scripts/validate_studio_artifacts.py --project out/free-gcp
          python scripts/test_free_gcp_runtime.py
          python scripts/test_pipeline_runtime.py --project out/free-gcp
          python scripts/test_colab_spark_modes.py
          python scripts/test_v13_evidence.py
          python scripts/test_bigquery_analytics.py
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Validate shared HCL separately with each engine and render Helm
        run: python scripts/validate_free_gcp_infra.py --project out/free-gcp --iac dual-validate --require-tools
      - name: Parse generated DAG with pinned Airflow 3
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
        run: |
          python -m pip install apache-airflow==3.2.2 apache-airflow-providers-standard --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.2.2/constraints-3.12.txt
          python scripts/parse_studio_dag.py --project out/free-gcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-gcp-validation
          path: out/free-gcp/validation/

  spark-and-dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate isolated Forge input
        run: dotnet run --project DatabaseGenerator --configuration Release -- forge generate --project examples/free-gcp-classic-native.project.json --output out/v13-runtime
      - name: Execute classic and true local Spark Connect
        run: |
          python -m venv .venv-spark
          .venv-spark/bin/python -m pip install 'pyspark[connect]==4.0.4'
          .venv-spark/bin/python scripts/run_colab_spark_smoke.py --project out/v13-runtime --output artifacts/spark-classic --mode classic
          .venv-spark/bin/python scripts/run_colab_spark_smoke.py --project out/v13-runtime --output artifacts/spark-connect --mode connect-local
      - name: Parse dbt-bigquery with no cloud execution
        env:
          FORGE_GCP_PROJECT: example-project
          FORGE_BQ_DATASET: contoso_forge
          FORGE_BQ_PREFIX: forge_ci_parse_
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        run: |
          python -m venv .venv-dbt
          .venv-dbt/bin/python -m pip install -r out/v13-runtime/dbt_bigquery/requirements.txt
          .venv-dbt/bin/dbt parse --project-dir out/v13-runtime/dbt_bigquery --profiles-dir out/v13-runtime/dbt_bigquery --no-partial-parse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v13-local-runtime-evidence
          path: |
            artifacts/spark-classic/
            artifacts/spark-connect/
            out/v13-runtime/dbt_bigquery/target/
