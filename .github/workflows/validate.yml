name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ContosoDGV2.sln

      - name: Build and test
        run: dotnet test ContosoDGV2.sln --configuration Release --no-restore

      - name: Generate twice and compare deterministic sources
        shell: bash
        run: |
          dotnet run --project DatabaseGenerator/DatabaseGenerator.csproj --configuration Release --no-build -- forge generate --project examples/customer-satisfaction.project.json --output out/first
          dotnet run --project DatabaseGenerator/DatabaseGenerator.csproj --configuration Release --no-build -- forge generate --project examples/customer-satisfaction.project.json --output out/second
          diff -qr out/first/data/source out/second/data/source
          test "$(jq -r .datasetFingerprint out/first/truth_manifest.json)" = "$(jq -r .datasetFingerprint out/second/truth_manifest.json)"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical Compose project
        run: docker compose -f compose.yaml --profile jobs --profile airflow config --quiet

      - name: Validate portable lab script
        run: python -m py_compile scripts/lab.py
