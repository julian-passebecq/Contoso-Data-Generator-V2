contoso_forge_bigquery:
  target: sandbox
  outputs:
    sandbox:
      type: bigquery
      method: oauth
      project: "{{ env_var('FORGE_GCP_PROJECT') }}"
      dataset: "{{ env_var('FORGE_BQ_DATASET') }}"
      location: "{{ env_var('FORGE_BQ_LOCATION', 'US') }}"
      threads: 1
      priority: interactive
      maximum_bytes_billed: "{{ env_var('FORGE_BQ_MAXIMUM_BYTES_BILLED', '1000000000') | int }}"
      job_execution_timeout_seconds: 300
      job_retries: 1
